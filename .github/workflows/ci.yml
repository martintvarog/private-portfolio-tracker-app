name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [backend, client]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Only one deploy at a time; later pushes queue rather than racing this one.
    # Never cancel: a half-applied Bicep deployment is worse than a short wait.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      id-token: write   # allows the job to request an OIDC token from GitHub
      contents: read
    env:
      IMAGE: acrportfoliotrackerapp.azurecr.io/portfoliotrackerapp:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login -n acrportfoliotrackerapp
      - run: docker build -t $IMAGE .
      - run: docker push $IMAGE
      # Unique name per run: ARM refuses to overwrite a deployment that is still active,
      # and run_id stays unique even when the same commit is re-run.
      - run: az deployment group create -g rg-portfoliotracker --name deploy-${{ github.run_id }} --template-file infra/main.bicep --parameters image=$IMAGE
